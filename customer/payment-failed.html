
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160d07">
<title>Payment Failed | Yatharth</title>

<style>
:root {
    --bg: #160d07;
    --gold: #ffb629;
    --gold-light: #ffd477;
    --text: #fff4df;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    padding: 24px 16px;
    display: grid;
    place-items: center;
    color: var(--text);
    background:
        radial-gradient(ellipse at 50% 38%, rgba(125,67,15,.2), transparent 52%),
        linear-gradient(145deg, #211207, var(--bg) 52%, #100904);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}

.card {
    width: min(100%, 500px);
    padding: 34px 30px 28px;
    text-align: center;
    border: 1px solid rgba(255,182,41,.34);
    border-radius: 30px;
    background: linear-gradient(155deg, #26180ef7, #140c07fc);
    box-shadow: 0 24px 80px #0008;
}

.failure-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    display: grid;
    place-items: center;
    border: 5px solid #f36b5c;
    border-radius: 50%;
    color: #fff;
    background: linear-gradient(145deg, #a83225, #6f211b);
    box-shadow: 0 0 30px #dc493c38;
    font-size: 48px;
    font-weight: 350;
    line-height: 1;
}

h1 {
    margin: 0 0 12px;
    color: #fff1d8;
    font-size: clamp(32px, 7vw, 44px);
    line-height: 1.12;
    letter-spacing: -1.4px;
}

.description {
    max-width: 390px;
    margin: 0 auto;
    color: #e0d1ba;
    font-size: 17px;
    line-height: 1.5;
}

.order-reference {
    width: fit-content;
    max-width: 100%;
    margin: 22px auto 0;
    padding: 11px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: 1px solid rgba(255,182,41,.65);
    border-radius: 999px;
    color: var(--gold-light);
    background: #ffb6290d;
    font-size: 17px;
    font-weight: 750;
    letter-spacing: .2px;
}

.order-reference svg {
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    stroke: currentColor;
}

.attempts {
    margin: 26px 0 18px;
    padding: 20px 20px 17px;
    text-align: left;
    border: 1px solid #ffb62940;
    border-radius: 23px;
    background: linear-gradient(145deg,#ffb62913,#ffffff05);
}

.attempt-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 19px;
    color: #fff0d6;
    font-size: 18px;
    font-weight: 700;
}

.bars {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 11px;
}

.bar {
    height: 12px;
    border-radius: 20px;
    background: #bea38045;
}

.bar.used {
    background: linear-gradient(90deg,#ffc13e,#e99516);
    box-shadow: 0 0 12px #ffb62929;
}

.remaining {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    color: #e5d3b8;
    font-size: 14px;
}

.remaining svg {
    width: 19px;
    height: 19px;
    color: var(--gold);
    flex: 0 0 auto;
}

.note {
    display: none;
    margin: 0 0 17px;
    padding: 14px 16px;
    border: 1px solid #668b3e;
    border-radius: 17px;
    color: #f3f1dc;
    background: linear-gradient(110deg,#1d3015,#202b13);
    font-size: 14px;
    line-height: 1.45;
    text-align: left;
}

.note::before {
    content: "✓";
    width: 30px;
    height: 30px;
    margin-right: 12px;
    display: inline-grid;
    place-items: center;
    vertical-align: middle;
    border: 2px solid #8dc77b;
    border-radius: 50%;
    color: #a5d88f;
    font-size: 19px;
    font-weight: 700;
}

.note.verifying,
.note.warning {
    border-color: #9a6a24;
    color: #f5dfb8;
    background: linear-gradient(110deg,#35230f,#2b1c0d);
}

.note.verifying::before,
.note.warning::before {
    content: "!";
    border-color: var(--gold);
    color: var(--gold-light);
}

.actions {
    display: grid;
    gap: 12px;
}

button {
    width: 100%;
    min-height: 60px;
    padding: 14px 20px;
    border-radius: 17px;
    font: inherit;
    font-size: 19px;
    font-weight: 750;
    cursor: pointer;
    transition: transform .16s, filter .16s;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    filter: brightness(1.06);
}

button:focus-visible {
    outline: 3px solid #fff0c9;
    outline-offset: 3px;
}

.primary {
    color: #241504;
    border: 1px solid #ffc34f;
    background: linear-gradient(105deg,#ffc13f,#f0a01d);
    box-shadow: 0 10px 24px #d9891226;
}

.secondary {
    color: #fff0d6;
    border: 2px solid var(--gold);
    background: #00000014;
}

button:disabled {
    cursor: not-allowed;
    opacity: .48;
}

.footnote {
    margin: 21px 4px 0;
    color: #c4b39a;
    font-size: 13px;
    line-height: 1.45;
}

.loader {
    display: inline-block;
    width: 15px;
    height: 15px;
    margin-right: 8px;
    vertical-align: -2px;
    border: 2px solid #fff0d659;
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 480px) {
    body { padding: 18px 12px; }

    .card {
        padding: 27px 19px 23px;
        border-radius: 25px;
    }

    .failure-icon {
        width: 64px;
        height: 64px;
        font-size: 42px;
        margin-bottom: 15px;
    }

    .description { font-size: 16px; }

    .order-reference {
        margin-top: 18px;
        padding: 10px 19px;
        font-size: 16px;
    }

    .attempts {
        margin: 23px 0 16px;
        padding: 18px 16px 15px;
    }

    .attempt-heading {
        font-size: 16px;
        margin-bottom: 16px;
    }

    .bars { gap: 9px; }
    .bar { height: 11px; }

    .note {
        padding: 12px 13px;
        font-size: 13px;
    }

    button {
        min-height: 56px;
        font-size: 18px;
    }

    .footnote {
        margin-top: 17px;
        font-size: 12px;
    }
}

@media (max-height: 760px) and (min-width: 481px) {
    body { padding: 12px; }

    .card {
        padding-top: 24px;
        padding-bottom: 21px;
    }

    .failure-icon {
        width: 58px;
        height: 58px;
        font-size: 39px;
        margin-bottom: 12px;
    }

    .order-reference { margin-top: 15px; }

    .attempts {
        margin-top: 19px;
        padding-top: 16px;
        padding-bottom: 14px;
    }

    .footnote { margin-top: 14px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="card" aria-live="polite">

    <div class="failure-icon" aria-hidden="true">×</div>

    <h1 id="title">Payment failed</h1>

    <p class="description" id="description">
        Your payment couldn’t be completed.<br>
        You can safely try again.
    </p>

    <div class="order-reference" aria-label="Order reference">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3.5h12v17l-2.5-1.8L12 20.5l-3.5-1.8L6 20.5z" />
            <path d="M9 8h6M9 12h6M9 16h3" />
        </svg>
        <span>ORDER #<span id="orderReference">—</span></span>
    </div>

    <section class="attempts" aria-label="Payment attempts">
        <div class="attempt-heading">
            <span>Payment attempts</span>
            <span id="attemptCount">1 of 3</span>
        </div>

        <div class="bars" aria-hidden="true">
            <span class="bar used" id="bar1"></span>
            <span class="bar" id="bar2"></span>
            <span class="bar" id="bar3"></span>
        </div>

        <div class="remaining" id="attemptsRemaining" aria-live="polite">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 2h12M6 22h12M7 2v5l5 5-5 5v5M17 2v5l-5 5 5 5v5" />
            </svg>
            <span>2 attempts remaining</span>
        </div>
    </section>

    <div class="note" id="note" role="status"></div>

    <div class="actions">
        <button class="primary" id="retry">Retry Payment</button>
        <button class="secondary" id="menu">Back to Menu</button>
    </div>

    <p class="footnote" id="footnote">
        Your order is saved and will be used for retry.
    </p>

</main>

<!-- EXISTING YATHARTH API FILES -->
<script src="./js/config.js"></script>
<script src="./js/api.js"></script>

<script>
const MAX_ATTEMPTS = 3;

const orderId = sessionStorage.getItem(
    "yatharth_pending_payment_order_id"
);

if (orderId) {
    document.getElementById("orderReference").textContent = orderId;
}

const retryButton = document.getElementById("retry");
const note = document.getElementById("note");

let retryAvailable = false;


// DISPLAY STATUS MESSAGE

function showNote(message, type = "success") {
    note.textContent = message;
    note.className = "note";

    if (type !== "success") {
        note.classList.add(type);
    }

    note.style.display = "block";
}


// UPDATE ATTEMPT INDICATOR

function setAttempts(value) {
    const used = Math.max(
        0,
        Math.min(MAX_ATTEMPTS, Number(value) || 0)
    );

    document.getElementById("attemptCount").textContent =
        used + " of " + MAX_ATTEMPTS;

    for (let i = 1; i <= MAX_ATTEMPTS; i++) {
        document.getElementById("bar" + i)
            .classList.toggle("used", i <= used);
    }

    const remaining = Math.max(0, MAX_ATTEMPTS - used);
    const remainingText = document.querySelector(
        "#attemptsRemaining span"
    );

    remainingText.textContent = remaining === 1
        ? "1 attempt remaining"
        : remaining + " attempts remaining";
}


// VERIFYING STATE

function verifying(message) {
    retryAvailable = false;
    retryButton.disabled = true;

    retryButton.innerHTML =
        '<span class="loader"></span>Checking payment status';

    showNote(
        message ||
        "We are confirming the payment status. Please keep this page open.",
        "verifying"
    );
}


// RETRY AVAILABLE STATE

function retryState(used) {
    retryAvailable = true;

    document.getElementById("title").textContent =
        "Payment failed";

    document.getElementById("description").innerHTML =
        "Your payment could not be completed.<br>Please try again.";

    document.getElementById("footnote").textContent =
        "Your order is saved and will be used for retry.";

    setAttempts(used);

    retryButton.disabled = false;
    retryButton.textContent = "Retry Payment";

    showNote(
        "Payment failure confirmed. You may safely retry."
    );
}


// ATTEMPTS EXHAUSTED STATE

function exhaustedState(used) {
    retryAvailable = false;

    document.getElementById("title").textContent =
        "Attempts limit reached";

    document.getElementById("description").innerHTML =
        "We couldn't complete your payment after 3 attempts.<br>Please return to the menu to start again.";

    document.getElementById("footnote").textContent =
        "The previous order cannot be retried. You can create a new order from the menu.";

    setAttempts(used);

    retryButton.disabled = true;
    retryButton.textContent = "Retry limit reached";

    showNote(
        "For your security, the maximum number of payment attempts has been reached.",
        "warning"
    );
}


// PAYMENT SUCCESS STATE

function confirmedState() {
    retryAvailable = false;

    document.getElementById("title").textContent =
        "Payment successful";

    document.getElementById("description").textContent =
        "Your payment has been confirmed. Taking you to your order details.";

    retryButton.disabled = true;
    retryButton.textContent = "Payment confirmed";

    showNote(
        "Your order has been confirmed. Redirecting to order details..."
    );

    setTimeout(() => {
        location.href = "./order.html";
    }, 1400);
}


// NORMALIZE API RESPONSE

function payloadOf(result) {
    return result?.data ??
           result?.result ??
           result ??
           {};
}


// FETCH PAYMENT STATUS

async function refreshStatus() {
    const p = payloadOf(
        await getPaymentAttempts(orderId)
    );

    const state = String(
        p.paymentState ??
        p.state ??
        p.order?.paymentState ??
        p.status ??
        ""
    ).toUpperCase();

    const used =
        p.order?.paymentAttemptsUsed ??
        p.paymentAttemptsUsed ??
        p.order?.attemptsUsed ??
        p.attemptsUsed ??
        p.attemptCount ??
        0;

    const orderStatus = String(
        p.order?.status ??
        p.orderStatus ??
        ""
    ).toUpperCase();

    setAttempts(used);

    if (
        state === "ATTEMPTS_EXHAUSTED" ||
        Number(used) >= MAX_ATTEMPTS
    ) {
        exhaustedState(used);
        return "EXHAUSTED";
    }

    if (
        orderStatus &&
        orderStatus !== "PENDING_PAYMENT"
    ) {
        confirmedState();
        return "CONFIRMED";
    }

    if (state === "RETRY_AVAILABLE") {
        retryState(used);
        return "RETRY_AVAILABLE";
    }

    return "PENDING";
}


// INITIALIZE FAILURE PAGE

async function initialize() {
    if (!orderId) {
        document.getElementById("title").textContent =
            "Payment status unavailable";

        document.getElementById("description").textContent =
            "We couldn't find the pending order details. Please return to the menu and check your order.";

        retryButton.disabled = true;
        retryButton.textContent = "Retry unavailable";

        showNote(
            "No pending payment order was found in this browser session."
        );

        return;
    }

    verifying();

    try {
        const raw = sessionStorage.getItem(
            "yatharth_payment_failure_data"
        );

        const failureData = raw
            ? JSON.parse(raw)
            : {};

        // RECONCILE PAYMENT FAILURE

        if (
            failureData.razorpay_order_id &&
            failureData.razorpay_payment_id
        ) {
            try {
                await reconcilePaymentFailure(
                    orderId,
                    failureData
                );
            } catch (error) {
                console.warn(
                    "Payment reconciliation request did not complete:",
                    error
                );
            }
        }

        // POLL PAYMENT STATUS

        for (let i = 0; i < 12; i++) {
            const state = await refreshStatus();

            if (state !== "PENDING") {
                if (
                    state === "RETRY_AVAILABLE" ||
                    state === "EXHAUSTED" ||
                    state === "CONFIRMED"
                ) {
                    sessionStorage.removeItem(
                        "yatharth_payment_failure_data"
                    );
                }

                return;
            }

            await new Promise(resolve =>
                setTimeout(
                    resolve,
                    Math.min(1000 + i * 400, 3500)
                )
            );
        }

        showCheckAgain();

    } catch (error) {
        console.error(
            "Unable to load payment status:",
            error
        );

        showCheckAgain();
    }
}


// CHECK STATUS AGAIN BUTTON

function showCheckAgain() {
    verifying(
        "We couldn't confirm the final payment status yet. Check again before attempting another payment."
    );

    retryButton.disabled = false;
    retryButton.textContent = "Check Payment Status";

    retryButton.onclick = () => {
        retryButton.onclick = null;
        initialize();
    };
}


// RETRY PAYMENT

retryButton.addEventListener("click", () => {
    if (!retryAvailable) return;

    sessionStorage.setItem(
        "yatharth_pending_payment_order_id",
        String(orderId)
    );

    sessionStorage.setItem(
        "yatharth_retry_payment_requested",
        "1"
    );

    retryButton.disabled = true;
    retryButton.textContent = "Opening payment...";

    location.href = "./index.html";
});


// BACK TO MENU

document.getElementById("menu").addEventListener(
    "click",
    () => {
        location.href = "./index.html";
    }
);


// START

initialize();
</script>

</body>
</html>
