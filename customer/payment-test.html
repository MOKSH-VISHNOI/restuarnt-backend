<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Yatharth Payment Test</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #05090d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 360px;
      padding: 30px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #0c1218;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #d6a84f;
      color: #05090d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #aaa;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Yatharth Payment Test</h2>

    <p>Order #407</p>
    <p>Amount: ₹50</p>

    <button id="payButton">
      Pay ₹50
    </button>

    <div id="status"></div>

  </div>

  <script>
    const API_URL = "http://localhost:5000";

    const orderId = 407;

    async function startPayment() {
      const status = document.getElementById("status");

      try {
        status.textContent = "Creating payment order...";

        // 1. Ask Yatharth backend for the Razorpay order
        const response = await fetch(
          `${API_URL}/api/payments/razorpay/order`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              orderId,
            }),
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || "Failed to create payment order");
        }

        const razorpayOrder = data.razorpayOrder;

        // 2. Open Razorpay Checkout
        const options = {
          key: "rzp_test_TjWIgA6g3eEIJp",

          amount: razorpayOrder.amount,

          currency: razorpayOrder.currency,

          name: "Yatharth",

          description: `Payment for Order #${orderId}`,

          order_id: razorpayOrder.id,

          handler: async function (paymentResponse) {

            status.textContent =
              "Payment received. Verifying...";

            console.log(
              "Razorpay payment response:",
              paymentResponse
            );

            // 3. Send Razorpay response to Yatharth backend
            const verifyResponse = await fetch(
              `${API_URL}/api/payments/razorpay/verify`,
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json",
                },

                body: JSON.stringify({
                  orderId,

                  razorpay_payment_id:
                    paymentResponse.razorpay_payment_id,

                  razorpay_order_id:
                    paymentResponse.razorpay_order_id,

                  razorpay_signature:
                    paymentResponse.razorpay_signature,
                }),
              }
            );

            const verifyData = await verifyResponse.json();

            console.log(
              "Verification response:",
              verifyData
            );

            if (!verifyResponse.ok || !verifyData.success) {
              status.textContent =
                "Payment verification failed.";

              return;
            }

            status.textContent =
              "Payment successful and verified! ✅";

            console.log(
              "Yatharth payment:",
              verifyData.payment
            );
          },

          modal: {
            ondismiss: function () {
              status.textContent =
                "Payment window closed.";
            },
          },

          theme: {
            color: "#d6a84f",
          },
        };

        const razorpay = new Razorpay(options);

        razorpay.on("payment.failed", function (response) {
          console.error(
            "Payment failed:",
            response.error
          );

          status.textContent =
            "Payment failed. Check console.";
        });

        razorpay.open();

      } catch (error) {

        console.error(error);

        status.textContent =
          error.message;
      }
    }

    document
      .getElementById("payButton")
      .addEventListener("click", startPayment);
  </script>

</body>
</html>
